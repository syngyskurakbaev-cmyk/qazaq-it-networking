<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Qazaq IT Networking</title>
<style>
:root{--ind:#4f54e6;--ind2:#7b7ff5;--teal:#5fe0c8;--navy:#272c5c;--ink:#1f2347;--w:#fff;--line:rgba(255,255,255,.6);--dim:rgba(31,35,71,.68);--glass:rgba(255,255,255,.32);--shadow:0 10px 40px rgba(60,66,140,.22);color-scheme:light}
*{box-sizing:border-box}
html{background:#8f98c6;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:var(--ink);font:14px/1.5 "Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;letter-spacing:0}
::selection{background:var(--ind);color:#fff}
*{scrollbar-width:thin;scrollbar-color:rgba(79,84,230,.6) transparent}
.hide{display:none!important}

/* ---------- BACKGROUND (frosted lavender + glossy orbs) ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(165deg,#aab3d8 0%,#939dcb 38%,#7f89bf 72%,#8a8fc9 100%)}
.fog{position:absolute;inset:0;background:radial-gradient(55% 40% at 12% 8%,rgba(255,255,255,.45),transparent 70%),radial-gradient(45% 35% at 90% 20%,rgba(150,170,255,.45),transparent 70%),radial-gradient(60% 40% at 88% 100%,rgba(255,220,205,.7),transparent 70%),radial-gradient(55% 40% at 5% 95%,rgba(95,105,190,.55),transparent 70%)}
.orb{position:absolute;border-radius:50%;opacity:.88;translate:calc(var(--mx,0)*-18px) calc(var(--my,0)*-10px);transition:translate .5s ease-out;animation:float 16s ease-in-out infinite alternate;
 background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,.5) 9%,transparent 22%),radial-gradient(circle at 35% 38%,#f2f4ff 0,#b9c6ff 34%,#7f78ea 66%,#e29bd8 100%);
 box-shadow:inset -14px -18px 46px rgba(255,255,255,.4),inset 10px 10px 40px rgba(120,100,230,.25),0 24px 70px rgba(80,76,190,.35)}
.o1{width:380px;height:380px;left:-150px;top:-130px;animation-duration:19s}
.o2{width:300px;height:300px;right:-130px;top:30px;animation-duration:15s;animation-delay:-4s}
.o3{width:46px;height:46px;left:23%;top:88px;animation-duration:11s;animation-delay:-2s}
.o4{width:240px;height:240px;right:-110px;top:58%;animation-duration:17s;animation-delay:-7s;opacity:.7}
.o5{width:150px;height:150px;left:44%;top:-70px;animation-duration:13s;animation-delay:-5s;opacity:.75}
.o6{width:110px;height:110px;left:-45px;top:64%;animation-duration:12s;animation-delay:-9s;opacity:.7}
#fx{position:absolute;inset:0;width:100%;height:100%}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14px,-22px,0) scale(1.04)}}

/* ---------- LAYOUT ---------- */
.w{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:26px 18px 70px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{display:flex;gap:14px;align-items:center}.lr{width:50px;height:50px;flex:none}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1;cursor:default;color:var(--navy)}
h1 span{background:linear-gradient(90deg,var(--ind),#4fc9ba);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.hbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lang,.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow)}
.lang button,.tabs button,.sndb{position:relative;overflow:hidden;border:0;background:none;color:var(--dim);font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.lang button:hover,.tabs button:hover{color:var(--ink);background:rgba(255,255,255,.45)}
.lang button.on,.tabs button.on{background:linear-gradient(135deg,var(--ind2),var(--ind));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(79,84,230,.45)}
.sndb{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.sndb:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.tabs{margin-bottom:18px}

/* ---------- GLASS PANELS ---------- */
.c,.r{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.2));border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}
.c{padding:22px;animation:boot .6s both}
@keyframes boot{0%{opacity:0;transform:translateY(14px) scale(.985)}100%{opacity:1;transform:none}}
.g{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}@media(max-width:860px){.g{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--dim);margin:16px 0 7px}
input,select,textarea{width:100%;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.55);color:var(--ink);border:1px solid rgba(255,255,255,.75);font:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:0;background:rgba(255,255,255,.8);border-color:var(--ind2);box-shadow:0 0 0 3px rgba(91,97,238,.25)}
input::placeholder{color:rgba(31,35,71,.45)}
select option{color:#1f2347;background:#fff}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.45);color:var(--ink);padding:4px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,color .15s,transform .15s,box-shadow .15s}
.chip:hover{background:rgba(255,255,255,.75);transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,var(--ind2),var(--ind));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,84,230,.4)}
.chip:active,.btn:active,.fb button:active,.lang button:active,.tabs button:active{transform:scale(.96)}
.btn{position:relative;overflow:hidden;width:100%;margin-top:18px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#6f74f2,#4a4fe0 55%,#3fb6ae);color:#fff;font:inherit;font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 28px rgba(79,84,230,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 14px 34px rgba(79,84,230,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:disabled{opacity:.7;cursor:wait;transform:none}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center;color:var(--dim)}
.pre button{position:relative;overflow:hidden;font:inherit;font-size:12px;padding:4px 12px;border:1px dashed rgba(79,84,230,.6);border-radius:999px;color:var(--ind);background:rgba(255,255,255,.4);cursor:pointer;transition:.15s}
.pre button:hover{background:var(--ind);color:#fff;border-style:solid}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ---------- RESULT CARDS ---------- */
.r{padding:18px;margin-bottom:16px;overflow:hidden;animation:boot .55s both;transition:transform .25s,box-shadow .25s,border-color .25s}
.r:hover{transform:translateY(-3px);border-color:#fff;box-shadow:0 18px 50px rgba(60,66,140,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.r.out{animation:out .28s forwards}
@keyframes out{to{opacity:0;transform:translateX(-40px) scale(.96);filter:blur(4px)}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.hd h3{margin:0;font-size:17px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--navy)}.hd>div:nth-child(2){flex:1;min-width:0}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff;background:linear-gradient(135deg,#8a8ff7,#4f54e6 60%,#4fc9ba);box-shadow:0 6px 16px rgba(79,84,230,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.meta{color:var(--dim);font-size:12.5px}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}.ring .t{stroke:rgba(79,84,230,.16)}
.ring .f{stroke:var(--ind);stroke-dasharray:150.8;stroke-dashoffset:150.8;animation:ringfill 1s .25s ease-out forwards;filter:drop-shadow(0 0 4px rgba(79,84,230,.45))}
@keyframes ringfill{to{stroke-dashoffset:calc(150.8 - 150.8 * var(--p) / 100)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--navy)}
.seg{display:flex;gap:3px;margin:10px 0}
.seg i{flex:1;height:8px;border-radius:4px;background:rgba(79,84,230,.14)}
.seg i.on{background:linear-gradient(90deg,var(--ind2),var(--ind));animation:seg .3s calc(var(--i)*28ms + .2s) both}
.seg i.on:nth-child(n+16){background:linear-gradient(90deg,var(--ind),var(--teal))}
@keyframes seg{from{transform:scaleY(.2);opacity:.2}to{transform:none;opacity:1}}
.why{margin:8px 0;color:rgba(31,35,71,.88)}
.say{border-radius:16px;background:linear-gradient(135deg,#2a2f5e,#3b4090);color:#f2f4ff;padding:12px 14px;font-size:13.5px;margin-top:10px;box-shadow:0 8px 22px rgba(39,44,92,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.say b{color:rgba(255,255,255,.62);font-weight:600;letter-spacing:.04em;font-size:12px}
.say .tx.typing:after{content:"▌";color:var(--teal);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.fb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fb button{position:relative;overflow:hidden;flex:1;min-width:110px;padding:9px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,255,255,.5);color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.fb button:hover{background:var(--ind);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(79,84,230,.4)}
.fb .m.on{background:var(--teal);color:var(--navy);font-weight:700;border-color:transparent}
.fb .n:hover{background:#e4577a;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.45);color:var(--dim)}
.b.g{display:inline-block;grid-template-columns:none;gap:0;background:rgba(95,224,200,.35);border-color:rgba(95,224,200,.8);color:#0d5a50}
.b.a{background:linear-gradient(135deg,var(--ind2),var(--ind));color:#fff;border-color:transparent}
.tm{display:inline-block;border-radius:999px;background:linear-gradient(135deg,#2a2f5e,#3b4090);padding:5px 14px;color:#e9ecff;font-size:12.5px;margin-bottom:12px;box-shadow:0 6px 18px rgba(39,44,92,.3)}

/* ---------- TOOLS / TABLES / MISC ---------- */
.tool{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;margin-bottom:16px}
.tool .chips{grid-column:1/-1;align-items:center}.tool select{width:auto}
.empty{color:var(--dim);text-align:center;padding:50px 20px;border:1px dashed rgba(255,255,255,.8);border-radius:24px;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:15px}
.empty.load>div{animation:blink 1s steps(2) infinite;color:var(--navy)}
.hring{width:110px;height:110px;display:block;margin:0 auto 14px}
.hring *{fill:none;stroke:var(--ind);transform-box:fill-box;transform-origin:center}
.hring .a{stroke-width:3;stroke-linecap:round;stroke-dasharray:60 20 6 20;animation:spin 14s linear infinite}
.hring .b2{stroke:#4fc9ba;stroke-width:1.5;stroke-dasharray:4 6;animation:spin 9s linear infinite reverse}
.hring .c2{stroke:var(--ind2);stroke-width:6;stroke-linecap:round;stroke-dasharray:30 12;animation:spin 5s linear infinite}
.hring .t{stroke:var(--navy);stroke-width:2;animation:none}
.load .hring .a{animation-duration:3s}.load .hring .c2{animation-duration:1.2s}
.lr .hring{width:50px;height:50px;margin:0;filter:drop-shadow(0 4px 10px rgba(79,84,230,.4))}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{overflow:auto;max-height:560px;border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid rgba(31,35,71,.1);padding:7px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#2a2f5e;color:#f2f4ff;font-weight:600;letter-spacing:.03em}
tr:hover td{background:rgba(255,255,255,.45)}
.dr{display:flex;gap:10px;align-items:center;margin:5px 0}.dr .k{width:150px;font-size:13px;flex:none}
.hb{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ind),var(--teal));transform-origin:left;animation:grow .8s both;box-shadow:0 2px 8px rgba(79,84,230,.35)}
@keyframes grow{from{transform:scaleX(0)}}
h3{font-size:14px;font-weight:700;color:var(--navy);margin:18px 0 8px}h3:first-child{margin-top:0}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.hc{grid-template-columns:1fr}}
.hi{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(31,35,71,.12)}
.hi button{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,255,255,.5);color:var(--ink);cursor:pointer;padding:4px 12px;font:inherit}
.hi button:hover{background:var(--ind);color:#fff}
:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style></head><body>

      +'<div class="fb"><button class="cpb" data-snd="copy" data-i="'+id+'">'+esc(x("copy"))+'</button><button class="m'+(st=="met"?" on":"")+'" data-snd="ok" data-i="'+id+'" data-a="met">✓ '+esc(t.met)+'</button><button class="n" data-snd="no" data-i="'+id+'" data-a="no">✗ '+esc(t.no)+'</button></div></div>';

  $("res").innerHTML=h;

  $("res").querySelectorAll(".ring").forEach(function(r,i){countUp(r.querySelector("b"),+r.dataset.p,i*70+250)});
  $("res").querySelectorAll(".tx").forEach(function(s,i){typeIn(s,s.dataset.t,i*70+350)});

  $("res").querySelectorAll(".fb button[data-a]").forEach(function(b){
    b.onclick=function(){
      var cid=Number(b.dataset.i),act=b.dataset.a;
      FB[cid]=act;save();
      fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({candidate_id:cid,status:act})}).catch(function(){});
      if(act=="no"){
        var card=b.closest(".r");card.classList.add("out");
        setTimeout(function(){run(true)},280);
      }else{b.classList.add("on")}
    };
  });
  $("res").querySelectorAll(".cpb").forEach(function(b){
    b.onclick=function(){
      var p=filtered.find(function(item){return item.id==b.dataset.i});
      if(p)cp(sayFor(me,p),b);
    };
  });
}
function rerender(){if(last)renderResults(lastResults,lastElapsed)}

async function run(silent){
  var my=++REQ,me=getMe(),btn=$("go");last=me;
  me.exclude_ids=Object.keys(FB).filter(function(id){return FB[id]=="no"}).map(Number);
  if(!silent){
    btn.disabled=true;btn.textContent=T[L].loading;
    $("res").innerHTML='<div class="empty load">'+ringSvg()+'<div>'+esc(T[L].loading)+'</div></div>';
  }
  try{
    var res=await fetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(me)});
    if(!res.ok)throw new Error("HTTP "+res.status);
    var data=await res.json();
    if(my!==REQ)return; // stale response: a newer request is in flight
    lastResults=Array.isArray(data.recommendations)?data.recommendations:[];
    lastElapsed=(typeof data.elapsed_ms==="number")?data.elapsed_ms:null;
    renderResults(lastResults,lastElapsed);
    if(!silent&&lastResults.length)snd("done");
  }catch(e){
    console.error(e);
    if(my!==REQ)return;
    if(silent&&lastResults.length)renderResults(lastResults,lastElapsed);
    else $("res").innerHTML='<div class="empty">'+esc(x("err"))+'</div>';
    snd("err");
  }finally{
    if(my===REQ){btn.disabled=false;btn.textContent=T[L].go}
  }
}

function cp(s,b){
  var o=b.textContent;
  function ok(){b.textContent=x("copied");setTimeout(function(){b.textContent=o},1500)}
  function alt(){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
  try{navigator.clipboard.writeText(s).then(ok,alt)}catch(e){alt()}
}

// ================= DB / DASH / HISTORY =================
function cnt(k){var o={};DB.forEach(function(p){if(p[k])o[p[k]]=(o[p[k]]||0)+1});return o}
function table(){
  var q=$("dq").value.toLowerCase().trim(),r=$("dr").value,g=$("dg").value,n=0,t=T[L];
  var h="<tr>"+x("th").map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr>";
  DB.forEach(function(p){
    if((r&&p.role!=r)||(g&&p.goal!=g))return;
    if(q&&[p.name,p.role,p.city,p.org,(p.stack||[]).join(" "),(p.interests||[]).join(" ")].join(" ").toLowerCase().indexOf(q)<0)return;
    n++;
    h+="<tr><td>"+esc(p.id)+"</td><td>"+esc(p.name)+"</td><td>"+esc(p.role)+"</td><td>"+esc((p.stack||[]).join(", "))+"</td><td>"+esc(p.years)+"</td><td>"+esc((p.interests||[]).join(", "))+"</td><td>"+esc(p.city)+"</td><td>"+esc(p.org)+"</td><td>"+esc((p.langs||[]).join("/"))+"</td><td>"+esc(t.goals[p.goal]||p.goal)+"</td></tr>";
  });
  $("tb").innerHTML=h;
  $("dinfo").textContent=DBERR?x("dberr"):f(t.db,{n:DB.length})+" · "+x("found")+": "+n;
}
function drawDash(){
  var t=T[L],c={},g={};
  DB.forEach(function(p){(p.interests||[]).forEach(function(i){c[i]=(c[i]||0)+1});g[p.goal]=(g[p.goal]||0)+1});
  function bars(o,lab){
    var vals=Object.values(o);if(!vals.length)return '<div class="meta">'+esc(DBERR?x("dberr"):x("none"))+'</div>';
    var m=Math.max.apply(null,vals);
    return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k,i){
      return '<div class="dr"><span class="k">'+esc(lab&&lab[k]?lab[k]:k)+'</span><div class="hb" style="width:'+Math.round(o[k]/m*100)+'%;flex:none;max-width:55%;animation-delay:'+(i*.03)+'s"></div><span class="meta">'+o[k]+'</span></div>';
    }).join("");
  }
  $("to").innerHTML="<h3>"+esc(t.dash)+"</h3>"+bars(c)+"<h3>"+esc(t.dashS)+"</h3>"+bars(g,t.goals)+"<h3>"+esc(x("cities"))+"</h3>"+bars(cnt("city"))+"<h3>"+esc(x("orgs"))+"</h3>"+bars(cnt("org"));
}
function hist(){
  var m=[],n=[];
  Object.keys(FB).forEach(function(id){var p=DB.find(function(item){return item.id==id});if(p)(FB[id]=="met"?m:n).push(p)});
  function col(title,a){
    return '<div><h3>'+esc(title)+' ('+a.length+')</h3>'+(a.length?a.map(function(p){
      return '<div class="hi"><div><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.role)+' · '+esc(p.city)+'</div></div><button data-i="'+esc(p.id)+'">'+esc(x("undo"))+'</button></div>';
    }).join(""):'<div class="meta">'+esc(x("none"))+'</div>')+'</div>';
  }
  $("th").innerHTML='<div class="hc">'+col("✓ "+T[L].met,m)+col("✗ "+x("rej"),n)+'</div>';
  $("th").querySelectorAll("button").forEach(function(b){b.onclick=function(){delete FB[b.dataset.i];save();hist();if(last)run(true)}});
}

// ================= UI TEXT / FILTERS =================
function cityList(){var c=Object.keys(cnt("city")).sort();return c.length?c:FALLBACK_CITIES}
function fillCity(){opts($("city"),'<option value="">'+esc(x("allc"))+'</option>'+cityList().map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join(""))}
function refreshData(){fillCity();table();drawDash();if(!$("th").classList.contains("hide"))hist()}
function ui(){
  var t=T[L];
  document.documentElement.lang=L;$("sub").textContent=t.sub;
  document.querySelectorAll("#tabs button").forEach(function(b,i){b.textContent=t.tabs[i]});

  $("lInt").textContent=t.ints;$("lAbout").textContent=t.about;$("lGoal").textContent=t.goal;

  opts($("goal"),goalOpts);

  opts($("rf"),roleOpts);opts($("dr"),roleOpts);

  $("pre").querySelectorAll("button").forEach(function(b){b.onclick=function(){fill(DEMO[b.dataset.d])}});

  var fm=$("fm");fm.innerHTML="";
  Object.keys(x("fm")).forEach(function(k){
    var c=document.createElement("button");c.type="button";c.dataset.snd="none";c.className="chip"+(k==FMT?" on":"");c.textContent=x("fm")[k];c.setAttribute("aria-pressed",k==FMT?"true":"false");
    c.onclick=function(){FMT=k;snd("chip",true);fm.querySelectorAll(".chip").forEach(function(e){var on=e==c;e.classList.toggle("on",on);e.setAttribute("aria-pressed",on?"true":"false")});rerender()};
    fm.appendChild(c);
  });
  $("cp").textContent=t.cp;
  if(!last)$("res").innerHTML='<div class="empty">'+ringSvg()+'<div>'+esc(t.emp)+'</div></div>';
  refreshData();sndLabel();
}

$("role").innerHTML=ROLES.map(function(r){return "<option>"+esc(r)+"</option>"}).join("");
chips($("stack"),STACK,"stack");chips($("ints"),INTS,"ints");chips($("lg"),LANGS,"langs");

document.querySelectorAll("#lang button").forEach(function(b){

    L=b.dataset.l;try{localStorage.setItem("qit_lang",L)}catch(e){}

document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("#tabs button").forEach(function(e){e.classList.toggle("on",e==b)});
  var map={m:"tm",d:"td",o:"to",h:"th"};

$("q").oninput=deb(rerender,150);$("rf").onchange=rerender;
var dtab=deb(table,150);$("dq").oninput=dtab;$("dr").onchange=table;$("dg").onchange=table;

ui();
loadProfilesFromBackend().then(refreshData);
